{% extends "base.html" %}
{% block title %}Page Not Found — Reuni{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 64px - 140px); display: flex; align-items: center; justify-content: center; padding: var(--space-6);">
    <div style="max-width: 480px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-4);">
        <div style="font-family: var(--font-mono); font-size: 72px; font-weight: 800; color: var(--color-primary-muted); line-height: 1;">404</div>
        <h1 style="font-size: 24px; font-weight: 700; color: var(--color-ink-primary); margin: 0;">Page Not Found</h1>
        <p style="font-size: 14px; color: var(--color-ink-secondary); line-height: var(--lead-body); margin: 0;">
            The page you requested could not be found. It might have been recycled, moved, or never existed in our loop.
        </p>
        <div style="margin-top: var(--space-2);">
            <a href="{{ url_for('index') }}" class="btn btn--primary" style="height: 44px; border-radius: var(--radius-md); font-weight: 600;">
                <span class="material-symbols-outlined" style="margin-right: 8px;">home</span>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
