{% extends "base.html" %}
{% block title %}Too Many Requests — Reuni{% endblock %}

{% block content %}
<div class="error-container" style="min-height: calc(100vh - 64px - 140px); display: flex; align-items: center; justify-content: center; padding: var(--space-6);">
    <style nonce="{{ csp_nonce }}">
        .error-card {
            background: var(--color-surface);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-xl);
            padding: var(--space-10) var(--space-8);
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--color-border);
        }
        .error-icon {
            color: var(--color-ink-tertiary);
            font-size: 64px;
            margin-bottom: var(--space-2);
        }
        .error-code-badge {
            font-family: var(--font-mono);
            font-size: 80px;
            font-weight: 800;
            line-height: 1;
            color: var(--color-primary);
            margin: 0;
            margin-bottom: var(--space-2);
            font-variant-numeric: tabular-nums;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-ink-primary);
            margin: 0;
            margin-bottom: var(--space-2);
        }
        .error-text {
            font-size: 14px;
            color: var(--color-ink-secondary);
            line-height: var(--lead-body);
            margin: 0;
            max-width: 38ch;
            margin-bottom: var(--space-6);
        }
    </style>
    
    <div class="error-card">
        <span class="material-symbols-outlined error-icon" aria-hidden="true">speed</span>
        <h1 class="error-code-badge">429</h1>
        <h2 class="error-title">Too Many Requests</h2>
        <p class="error-text">
            You are submitting requests too quickly. Please pause for a moment and try again shortly.
        </p>
        
        <div style="width: 100%;">
            <a href="{{ url_for('index') }}" class="btn btn--outline" style="height: 44px; border-radius: var(--radius-md); width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border-color: var(--color-border); color: var(--color-ink-secondary); font-weight: 600;">
                <span class="material-symbols-outlined" style="font-size: 18px;" aria-hidden="true">home</span>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
