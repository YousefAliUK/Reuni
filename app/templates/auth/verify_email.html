{% extends "base.html" %}
{% block title %}Verify Email — Reuni{% endblock %}

{% block content %}
<div class="auth-container">
    <!-- Icon -->
    <div class="auth-header__icon">
        <span class="material-symbols-outlined" aria-hidden="true">mail</span>
    </div>

    <div class="auth-header">
        <h1 class="auth-header__title">Check your email</h1>
        <p class="auth-header__sub">
            We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 15 minutes.
        </p>
    </div>

    <!-- MAIN INTERACTION CARD -->
    <div class="auth-card">
        <form method="POST" action="{{ url_for('auth.verify_email') }}" id="otp-form" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="code" id="full-code-input" required>

            <label for="otp-input-0" class="auth-label" style="text-align: center; margin-bottom: var(--space-2);">
                6-Digit Verification Code
            </label>

            <!-- OTP blocks -->
            <div class="otp-inputs-grid">
                <input type="text" class="otp-digit otp-digit-box" id="otp-input-0" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="0" autocomplete="one-time-code" autofocus>
                <input type="text" class="otp-digit otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="1" autocomplete="one-time-code">
                <input type="text" class="otp-digit otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="2" autocomplete="one-time-code">
                <input type="text" class="otp-digit otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="3" autocomplete="one-time-code">
                <input type="text" class="otp-digit otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="4" autocomplete="one-time-code">
                <input type="text" class="otp-digit otp-digit-box" maxlength="1" pattern="[0-9]" inputmode="numeric" required data-index="5" autocomplete="one-time-code">
            </div>

            <button type="submit" class="btn btn--primary" id="confirm-btn" style="height: 48px; border-radius: var(--radius-md); font-weight: 600;" disabled>
                Verify Email
            </button>
        </form>

        <div class="auth-footer-links">
            <span>Didn't receive the code? <a href="{{ url_for('auth.resend_verification') }}">Resend code</a></span>
            <span style="font-size: 11px; color: var(--color-ink-tertiary);">Limit 10 per hour</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
