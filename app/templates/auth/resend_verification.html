{% extends "base.html" %}
{% block title %}Resend Verification Code — Reuni{% endblock %}

{% block content %}
<div class="auth-container">

    <div class="auth-card">
        <!-- Icon -->
        <div class="auth-header__icon">
            <span class="material-symbols-outlined" aria-hidden="true">mail</span>
        </div>

        <!-- Title -->
        <div class="auth-header">
            <h1 class="auth-header__title">Resend Verification Code</h1>
            <p class="auth-header__sub auth-message-block">
                Enter your university email address below to request a new 6-digit verification code.
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.resend_verification') }}" class="auth-resend-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="auth-resend-field">
                <label for="email" class="auth-resend-field__label">University Email</label>
                <div class="auth-input-wrapper">
                    <span class="material-symbols-outlined" aria-hidden="true">mail</span>
                    <input type="email" id="email" name="email" placeholder="you@brookes.ac.uk" required
                           class="auth-resend-input">
                </div>
            </div>

            <button type="submit" class="btn btn--primary auth-form__submit-btn">Send Code</button>
        </form>

        <div class="auth-dialog-footer">
            Remembered your code or verified? <a href="{{ url_for('auth.login') }}" class="auth-dialog-footer__link">Log in</a>
        </div>
    </div>

</div>
{% endblock %}
