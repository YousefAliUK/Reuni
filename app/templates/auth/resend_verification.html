{% extends "base.html" %}
{% block title %}Resend Verification Code — Reuni{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Resend Verification Code</h2>
    <p style="margin-bottom: 1.5rem; color: var(--text-light); text-align: center;">
        Enter your university email address below to request a new 6-digit verification code.
    </p>
    <form method="POST" action="{{ url_for('auth.resend_verification') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form__group">
            <label for="email">University Email</label>
            <input type="email" id="email" name="email" placeholder="you@university.ac.uk" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Send Code</button>
    </form>
    <p class="auth-container__footer">
        Remembered your code or verified? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
</div>
{% endblock %}
