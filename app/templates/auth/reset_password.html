{% extends "base.html" %}
{% block title %}Set a new password — Reuni{% endblock %}

{% block content %}
<div class="auth-container">

    <!-- Icon -->
    <div class="auth-header__icon">
        <span class="material-symbols-outlined" aria-hidden="true">lock</span>
    </div>

    <!-- Title -->
    <div class="auth-header">
        <h1 class="auth-header__title">Set a new password</h1>
    </div>

    <!-- MAIN CARD -->
    <div class="auth-card">
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- New Password -->
            <div class="auth-form-group">
                <label for="new_password" class="auth-label">New password</label>
                <div style="position: relative; width: 100%;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); font-size: 20px;" aria-hidden="true">lock</span>
                    <input type="password" id="new_password" name="new_password" placeholder="••••••••" required minlength="8" class="auth-input" style="padding-left: 44px; padding-right: 44px;" autocomplete="new-password" spellcheck="false">
                    <button type="button" onclick="togglePasswordVisibility('new_password')" aria-label="Toggle new password visibility" aria-pressed="false" class="password-toggle">
                        <span class="material-symbols-outlined" id="eye-icon-new_password" style="font-size: 20px;" aria-hidden="true">visibility</span>
                    </button>
                </div>
                
                <!-- Password Strength Indicator -->
                <div style="margin-top: 6px;">
                    <div class="password-strength-grid">
                        <div id="strength-bar-1" class="password-strength-bar"></div>
                        <div id="strength-bar-2" class="password-strength-bar"></div>
                        <div id="strength-bar-3" class="password-strength-bar"></div>
                    </div>
                    <span id="strength-label" style="font-size: 11px; color: var(--color-ink-tertiary); display: block; margin-top: 4px;">Strength: too short</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="auth-form-group">
                <label for="confirm_password" class="auth-label">Confirm new password</label>
                <div style="position: relative; width: 100%;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); font-size: 20px;" aria-hidden="true">lock</span>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required minlength="8" class="auth-input" style="padding-left: 44px; padding-right: 44px;" autocomplete="new-password" spellcheck="false">
                    <button type="button" onclick="togglePasswordVisibility('confirm_password')" aria-label="Toggle confirm password visibility" aria-pressed="false" class="password-toggle">
                        <span class="material-symbols-outlined" id="eye-icon-confirm_password" style="font-size: 20px;" aria-hidden="true">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary" style="height: 48px; border-radius: var(--radius-md); font-weight: 600; width: 100%;">Set password</button>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
