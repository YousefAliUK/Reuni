{% extends "base.html" %}
{% block title %}Set a new password — Reuni{% endblock %}

{% block content %}
<div class="auth-container">

    <!-- Icon -->
    <div class="auth-header__icon">
        <span class="material-symbols-outlined">lock</span>
    </div>

    <!-- Title -->
    <div class="auth-header">
        <h1 class="auth-header__title">Set a new password</h1>
    </div>

    <!-- MAIN CARD -->
    <div class="auth-card">
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- New Password -->
            <div class="auth-form-group">
                <label for="new_password" class="auth-label">New password</label>
                <div style="position: relative; width: 100%;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); font-size: 20px;">lock</span>
                    <input type="password" id="new_password" name="new_password" placeholder="••••••••" required minlength="8" class="auth-input" style="padding-left: 44px; padding-right: 44px;">
                    <button type="button" onclick="togglePasswordVisibility('new_password')" aria-label="Toggle new password visibility" aria-pressed="false" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-ink-tertiary); display: flex; align-items: center; justify-content: center;">
                        <span class="material-symbols-outlined" id="eye-icon-new_password" style="font-size: 20px;">visibility</span>
                    </button>
                </div>
                
                <!-- Password Strength Indicator -->
                <div style="margin-top: 6px;">
                    <div style="display: flex; gap: 4px; height: 4px; background: var(--color-surface-raised); border-radius: 2px; overflow: hidden;">
                        <div id="strength-bar-1" style="flex: 1; height: 100%; transition: background var(--duration-fast);"></div>
                        <div id="strength-bar-2" style="flex: 1; height: 100%; transition: background var(--duration-fast);"></div>
                        <div id="strength-bar-3" style="flex: 1; height: 100%; transition: background var(--duration-fast);"></div>
                    </div>
                    <span id="strength-label" style="font-size: 11px; color: var(--color-ink-tertiary); display: block; margin-top: 4px;">Strength: too short</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="auth-form-group">
                <label for="confirm_password" class="auth-label">Confirm new password</label>
                <div style="position: relative; width: 100%;">
                    <span class="material-symbols-outlined" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-tertiary); font-size: 20px;">lock</span>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required minlength="8" class="auth-input" style="padding-left: 44px; padding-right: 44px;">
                    <button type="button" onclick="togglePasswordVisibility('confirm_password')" aria-label="Toggle confirm password visibility" aria-pressed="false" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-ink-tertiary); display: flex; align-items: center; justify-content: center;">
                        <span class="material-symbols-outlined" id="eye-icon-confirm_password" style="font-size: 20px;">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn--primary" style="height: 48px; border-radius: var(--radius-md); font-weight: 600; width: 100%;">Set password</button>
        </form>
    </div>

</div>


<script>
    function togglePasswordVisibility(fieldId) {
        var field = document.getElementById(fieldId);
        var icon = document.getElementById('eye-icon-' + fieldId);
        var btn = field ? field.nextElementSibling : null;
        if (field && icon) {
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = 'visibility_off';
                if (btn) { btn.setAttribute('aria-label', 'Hide password'); btn.setAttribute('aria-pressed', 'true'); }
            } else {
                field.type = 'password';
                icon.textContent = 'visibility';
                if (btn) { btn.setAttribute('aria-label', 'Show password'); btn.setAttribute('aria-pressed', 'false'); }
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var passwordInput = document.getElementById('new_password');
        if (passwordInput) {
            passwordInput.addEventListener('input', function() {
                var val = passwordInput.value;
                var score = 0;
                if (val.length >= 8) score++;
                if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
                if (/[0-9]/.test(val)) score++;
                
                var bar1 = document.getElementById('strength-bar-1');
                var bar2 = document.getElementById('strength-bar-2');
                var bar3 = document.getElementById('strength-bar-3');
                var label = document.getElementById('strength-label');
                
                if (bar1 && bar2 && bar3 && label) {
                    bar1.style.background = 'var(--color-surface-raised)';
                    bar2.style.background = 'var(--color-surface-raised)';
                    bar3.style.background = 'var(--color-surface-raised)';
                    
                    if (val.length === 0) {
                        label.textContent = 'Strength: too short';
                    } else if (score === 1) {
                        bar1.style.background = 'var(--color-danger)';
                        label.textContent = 'Strength: weak';
                    } else if (score === 2) {
                        bar1.style.background = 'var(--color-warning)';
                        bar2.style.background = 'var(--color-warning)';
                        label.textContent = 'Strength: medium';
                    } else if (score === 3) {
                        bar1.style.background = 'var(--color-success)';
                        bar2.style.background = 'var(--color-success)';
                        bar3.style.background = 'var(--color-success)';
                        label.textContent = 'Strength: strong';
                    }
                }
            });
        }

        // Real-time password match validation
        var newPwInput = document.getElementById('new_password');
        var confirmPwInput = document.getElementById('confirm_password');
        if (newPwInput && confirmPwInput) {
            function checkPasswordMatch() {
                if (confirmPwInput.value && confirmPwInput.value !== newPwInput.value) {
                    confirmPwInput.setCustomValidity('Passwords do not match');
                } else {
                    confirmPwInput.setCustomValidity('');
                }
            }
            confirmPwInput.addEventListener('input', checkPasswordMatch);
            newPwInput.addEventListener('input', function() {
                if (confirmPwInput.value) checkPasswordMatch();
            });
        }
    });
</script>
{% endblock %}
