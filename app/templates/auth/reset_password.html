{% extends "base.html" %}
{% block title %}Set a new password — Reuni{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Set a new password</h2>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form__group">
            <label for="new_password">New password</label>
            <input type="password" id="new_password" name="new_password" placeholder="••••••••" required>
        </div>
        <div class="form__group">
            <label for="confirm_password">Confirm new password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>
        <p style="margin-top: -0.5rem; margin-bottom: var(--space-lg); font-size: var(--fs-xs); color: var(--clr-text-muted);">
            At least 8 characters with a number and uppercase letter.
        </p>
        <button type="submit" class="btn btn--primary btn--block">Update password</button>
    </form>
</div>
{% endblock %}
