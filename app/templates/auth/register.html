{% extends "base.html" %}
{% block title %}Sign Up — UniCycle{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Create Account</h2>
    <form method="POST" action="{{ url_for('auth.register') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form__group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Jane Doe" required>
        </div>
        <div class="form__group">
            <label for="email">University Email</label>
            <input type="email" id="email" name="email" placeholder="you@university.ac.uk" required>
        </div>
        <div class="form__group">
            <label for="phone_number">WhatsApp Number</label>
            <input type="tel" id="phone_number" name="phone_number" placeholder="07912 345 678" required>
            <small class="form__hint">Used to coordinate meetups with buyers</small>
        </div>
        <div class="form__group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
        </div>
        <div class="form__group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required
                minlength="8">
        </div>
        <button type="submit" class="btn btn--primary btn--block">Sign Up</button>
    </form>
    <p class="auth-container__footer">
        Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
</div>
{% endblock %}
