{% extends "base.html" %}
{% block title %}Reset your password — Reuni{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Reset your password</h2>
    <p style="margin-bottom: 1.5rem; color: var(--clr-text-muted); text-align: center;">
        Enter your university email and we'll send you a reset link.
    </p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form__group">
            <label for="email">University Email</label>
            <input type="email" id="email" name="email" placeholder="you@university.ac.uk" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Send reset link</button>
    </form>
    <p class="auth-container__footer">
        <a href="{{ url_for('auth.login') }}">Back to login</a>
    </p>
</div>
{% endblock %}
