name: Reuni CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Optional: if you transition to redis/postgres database for production rate limiting/limiter storage URI
      # redis:
      #   image: redis
      #   ports:
      #     - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install testing utility packages if not in requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest Regression Suite
        env:
          FLASK_ENV: testing
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'ci-testing-key-not-for-prod' }}
        run: |
          pytest --cov=app --cov-report=xml

      - name: Run Active Pentesting Simulation Suite
        env:
          FLASK_ENV: development
          DISABLE_RATE_LIMITS_FOR_PENTEST: True
        run: |
          python pentest.py
